services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: privacygateway
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d privacygateway"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  privacy-detector:
    build:
      context: ./privacy-detector
    environment:
      PRIVACY_DETECTOR_TOKEN: ${PRIVACY_DETECTOR_TOKEN}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      VAULT_ENCRYPTION_KEY: ${VAULT_ENCRYPTION_KEY}
      VAULT_HASH_KEY: ${VAULT_HASH_KEY}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      JWT_SECRET: ${JWT_SECRET}
      PRIVACY_DETECTOR_URL: ${PRIVACY_DETECTOR_URL}
      PRIVACY_DETECTOR_TOKEN: ${PRIVACY_DETECTOR_TOKEN}
      TOKEN_TTL_HOURS: ${TOKEN_TTL_HOURS}
      DEV_TOKEN_ENABLED: ${DEV_TOKEN_ENABLED:-false}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      privacy-detector:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
    ports:
      - "3001:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  ollama_data:
