spring:
  application:
    name: privacy-gateway
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: never

app:
  jwt-secret: ${JWT_SECRET:}
  vault-encryption-key: ${VAULT_ENCRYPTION_KEY}
  vault-hash-key: ${VAULT_HASH_KEY:}
  privacy-detector-url: ${PRIVACY_DETECTOR_URL:http://localhost:8000}
  privacy-detector-token: ${PRIVACY_DETECTOR_TOKEN:}
  token-ttl-hours: ${TOKEN_TTL_HOURS:24}
  dev-token-enabled: ${DEV_TOKEN_ENABLED:false}

llm:
  provider: ${LLM_PROVIDER:ollama}
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  model: ${OLLAMA_MODEL:}
  timeout-seconds: ${OLLAMA_TIMEOUT_SECONDS:60}
