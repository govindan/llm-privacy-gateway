spring:
  datasource:
    url: jdbc:h2:mem:privacygateway;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt-secret: test-jwt-secret-must-be-at-least-32-bytes-long!!
  vault-encryption-key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  vault-hash-key: BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB=
  token-ttl-hours: 24
  privacy-detector-url: http://localhost:8000
  privacy-detector-token: test-detector-token
  dev-token-enabled: true

llm:
  provider: ollama
  base-url: http://localhost:11434
  model: test-model
  timeout-seconds: 5
